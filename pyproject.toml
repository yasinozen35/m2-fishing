[project]
name = "fishing-bot"
version = "0.1.0"
description = "Balık tutma oyunu için otomatik görüntü işleme botu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=9.0.0",
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "pyautogui>=0.9.54",
    "customtkinter>=5.2.2",
    "requests>=2.31.0",
    "pydirectinput>=1.0.4",
]

[project.scripts]
fishing-bot = "fishing_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishing_bot"]

[tool.uv]
dev-dependencies = []
